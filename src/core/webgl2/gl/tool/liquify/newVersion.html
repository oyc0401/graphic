<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>업그레이드 커널 비교 결과</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      table {
        border-collapse: collapse;
        margin-top: 20px;
      }

      td,
      th {
        border: 1px solid #ccc;
        text-align: center;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 8px;
        color: #555;
        font-size: 14px;
      }

      .toolbar button {
        border: 1px solid #bbb;
        background: #fff;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
      }

      .summary {
        max-width: 960px;
        margin-top: 12px;
        color: #555;
        line-height: 1.55;
        text-align: center;
      }

      .charts {
        display: grid;
        grid-template-columns: repeat(2, minmax(320px, 1fr));
        gap: 16px;
        width: min(980px, 100%);
        margin-top: 18px;
      }

      canvas {
        width: 100%;
        height: 190px;
        border: 1px solid #ccc;
        background: #fff;
      }

      @media (max-width: 760px) {
        .charts {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>기초 거리 방식 vs 목표 단면 역설계 방식</h1>
      <div class="toolbar">
        <button id="prevButton" type="button">이전</button>
        <strong id="modeLabel">기초 방식</strong>
        <button id="nextButton" type="button">다음</button>
        <span>좌우 방향키로 전환</span>
      </div>
      <p class="summary" id="summary">
        기초 방식은 각 픽셀이 선분에 얼마나 가까운지만 보고 ease를 적용한다.
      </p>
      <div class="charts">
        <canvas id="profileCanvas" width="640" height="260"></canvas>
        <canvas id="kernelCanvas" width="640" height="260"></canvas>
      </div>
      <div id="output">계산 중...</div>
    </div>

    <script>
      const radius = 10;
      const dx = 50;
      const dy = 0;
      const rCeil = Math.ceil(radius);
      const width = Math.abs(dx) + 2 * rCeil + 1;
      const height = Math.abs(dy) + 2 * rCeil + 1;
      const startX = rCeil;
      const startY = rCeil;
      const endX = startX + dx;
      const endY = startY + dy;

      const output = document.getElementById("output");
      const modeLabel = document.getElementById("modeLabel");
      const summary = document.getElementById("summary");
      const profileCanvas = document.getElementById("profileCanvas");
      const kernelCanvas = document.getElementById("kernelCanvas");
      const profileCtx = profileCanvas.getContext("2d");
      const kernelCtx = kernelCanvas.getContext("2d");

      let currentMode = 0;
      let basicGrid = null;
      let upgradedGrid = null;
      let diffGrid = null;
      let solvedKernel = null;
      let targetProfile = null;
      let predictedProfile = null;

      function easeInOut(x) {
        if (x <= 0) return 0;
        if (x >= 1) return 1;
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      }

      function makeGrid(fill = 0) {
        return Array.from({ length: height }, () => Array(width).fill(fill));
      }

      function distanceToSegment(px, py) {
        const vx = px - startX;
        const vy = py - startY;
        const len2 = dx * dx + dy * dy;
        const rawT = len2 === 0 ? 0 : (vx * dx + vy * dy) / len2;
        const t = Math.max(0, Math.min(1, rawT));
        const cx = startX + dx * t;
        const cy = startY + dy * t;
        return Math.hypot(px - cx, py - cy);
      }

      function generateBasicGrid() {
        const grid = makeGrid();
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const d = distanceToSegment(x, y);
            const input = Math.max(0, 1 - d / radius);
            grid[y][x] = easeInOut(input);
          }
        }
        return grid;
      }

      function buildForwardMatrix(n, m, uSamples) {
        const matrix = Array.from({ length: n }, () => Array(m).fill(0));

        for (let i = 0; i < n; i++) {
          const x = i / (n - 1);
          const umax = Math.sqrt(Math.max(0, 1 - x * x));
          if (umax === 0) continue;

          const du = umax / uSamples;
          for (let k = 0; k < uSamples; k++) {
            const u = (k + 0.5) * du;
            const r = Math.sqrt(x * x + u * u);
            const pos = r * (m - 1);
            const j0 = Math.min(m - 1, Math.floor(pos));
            const j1 = Math.min(m - 1, j0 + 1);
            const t = pos - j0;
            const weight = 2 * du;

            matrix[i][j0] += weight * (1 - t);
            matrix[i][j1] += weight * t;
          }
        }

        return matrix;
      }

      function matVec(matrix, vector) {
        return matrix.map((row) => {
          let sum = 0;
          for (let j = 0; j < vector.length; j++) sum += row[j] * vector[j];
          return sum;
        });
      }

      function matTVec(matrix, vector) {
        const result = Array(matrix[0].length).fill(0);
        for (let i = 0; i < matrix.length; i++) {
          for (let j = 0; j < result.length; j++) {
            result[j] += matrix[i][j] * vector[i];
          }
        }
        return result;
      }

      function addSmoothGradient(gradient, kernel, lambda) {
        for (let j = 1; j < kernel.length - 1; j++) {
          const second = kernel[j - 1] - 2 * kernel[j] + kernel[j + 1];
          gradient[j - 1] += 2 * lambda * second;
          gradient[j] += -4 * lambda * second;
          gradient[j + 1] += 2 * lambda * second;
        }
      }

      function solveKernelFromTarget() {
        const n = 72;
        const m = 72;
        const matrix = buildForwardMatrix(n, m, 180);
        const target = Array.from({ length: n }, (_, i) => {
          const x = i / (n - 1);
          return easeInOut(1 - x);
        });

        let kernel = Array.from({ length: m }, (_, j) => {
          const r = j / (m - 1);
          return Math.max(0, easeInOut(1 - r) * 0.55);
        });

        const lambda = 0.0008;
        const lr = 0.018;
        for (let iter = 0; iter < 1600; iter++) {
          const predicted = matVec(matrix, kernel);
          const residual = predicted.map((value, i) => value - target[i]);
          const gradient = matTVec(matrix, residual).map((value) => 2 * value);
          addSmoothGradient(gradient, kernel, lambda);

          for (let j = 0; j < kernel.length; j++) {
            kernel[j] = Math.max(0, kernel[j] - lr * gradient[j]);
          }
        }

        return {
          kernel,
          target,
          predicted: matVec(matrix, kernel),
        };
      }

      function sampleKernel(kernel, normalizedDistance) {
        if (normalizedDistance >= 1) return 0;
        if (normalizedDistance <= 0) return kernel[0];

        const pos = normalizedDistance * (kernel.length - 1);
        const j0 = Math.floor(pos);
        const j1 = Math.min(kernel.length - 1, j0 + 1);
        const t = pos - j0;
        return kernel[j0] * (1 - t) + kernel[j1] * t;
      }

      function generateUpgradedGrid(kernel) {
        const grid = makeGrid();
        const steps = 260;
        const length = Math.hypot(dx, dy);
        const dl = length / steps;

        for (let i = 0; i <= steps; i++) {
          const s = i / steps;
          const cx = startX + dx * s;
          const cy = startY + dy * s;

          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              const d = Math.hypot(x - cx, y - cy);
              grid[y][x] += sampleKernel(kernel, d / radius) * dl;
            }
          }
        }

        const max = Math.max(...grid.flat());
        if (max > 0) {
          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) grid[y][x] /= max;
          }
        }

        return grid;
      }

      function subtractGrids(a, b) {
        const result = makeGrid();
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) result[y][x] = a[y][x] - b[y][x];
        }
        return result;
      }

      function colorForValue(value, mode) {
        if (mode === 2) {
          if (value >= 0) return `rgba(0, 180, 210, ${Math.min(1, value * 4)})`;
          return `rgba(230, 0, 180, ${Math.min(1, -value * 4)})`;
        }

        return `rgba(255, 0, 0, ${Math.min(0.95, value)})`;
      }

      function displayTable(grid, mode) {
        let html = '<table style="border-collapse: collapse; margin: 10px;">';
        html += "<tr><th></th>";
        for (let x = 0; x < width; x++) {
          html += `<th style="width: 16px; height: 16px; font-size: 6px;">${x}</th>`;
        }
        html += "</tr>";

        for (let y = 0; y < height; y++) {
          html += `<tr><th style="font-size: 6px;">${y}</th>`;
          for (let x = 0; x < width; x++) {
            const value = grid[y][x];
            html += `<td style="
              width: 16px;
              height: 16px;
              font-size: 6px;
              padding: 0;
              background-color: ${colorForValue(value, mode)};
            ">${value.toFixed(2)}</td>`;
          }
          html += "</tr>";
        }

        html += "</table>";
        output.innerHTML = html;
      }

      function drawLineChart(ctx, series, labels) {
        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        const pad = 34;
        const w = ctx.canvas.width;
        const h = ctx.canvas.height;
        const values = series.flatMap((item) => item.values);
        const min = Math.min(0, ...values);
        const max = Math.max(1, ...values);

        ctx.strokeStyle = "#ddd";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(pad, h - pad);
        ctx.lineTo(w - pad, h - pad);
        ctx.moveTo(pad, pad);
        ctx.lineTo(pad, h - pad);
        ctx.stroke();

        series.forEach((item) => {
          ctx.beginPath();
          item.values.forEach((value, i) => {
            const x = pad + (i / (item.values.length - 1)) * (w - pad * 2);
            const y = h - pad - ((value - min) / (max - min)) * (h - pad * 2);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.strokeStyle = item.color;
          ctx.lineWidth = 3;
          ctx.stroke();
        });

        ctx.fillStyle = "#333";
        ctx.font = "13px Arial";
        labels.forEach((label, i) => {
          ctx.fillStyle = series[i].color;
          ctx.fillText(label, pad + i * 150, 20);
        });
      }

      function middleRow(grid) {
        return grid[startY].slice(startX, endX + 1);
      }

      function verticalProfile(grid) {
        const x = Math.floor((startX + endX) / 2);
        return grid.map((row) => row[x]);
      }

      function drawCharts() {
        drawLineChart(
          profileCtx,
          [
            { values: targetProfile, color: "#0b7f82" },
            { values: predictedProfile, color: "#d1495b" },
          ],
          ["목표 단면", "역설계 결과"],
        );

        drawLineChart(
          kernelCtx,
          [{ values: solvedKernel, color: "#7b61ff" }],
          ["역산된 커널 K(r)"],
        );
      }

      function displayMode() {
        const modes = [
          {
            label: "기초 방식",
            text: "각 픽셀이 선분에 얼마나 가까운지만 판단하고 ease를 적용한다. 빠르고 단순하지만 중앙 단면의 최종 모양을 직접 통제하지 못한다.",
            grid: basicGrid,
          },
          {
            label: "역설계 커널 방식",
            text: "원하는 최종 단면을 먼저 정하고, 그 단면을 만들 커널 K(r)를 수치 최적화로 구한 뒤 누적한다.",
            grid: upgradedGrid,
          },
          {
            label: "차이",
            text: "cyan은 역설계 방식이 더 큰 영역, magenta는 기초 방식이 더 큰 영역이다.",
            grid: diffGrid,
          },
        ];

        const mode = modes[currentMode];
        modeLabel.textContent = mode.label;
        summary.textContent = mode.text;
        displayTable(mode.grid, currentMode);
        drawCharts();
      }

      function moveMode(delta) {
        currentMode = (currentMode + delta + 3) % 3;
        displayMode();
      }

      document.getElementById("prevButton").addEventListener("click", () => moveMode(-1));
      document.getElementById("nextButton").addEventListener("click", () => moveMode(1));
      document.addEventListener("keydown", (event) => {
        if (event.code === "ArrowLeft") moveMode(-1);
        if (event.code === "ArrowRight") moveMode(1);
      });

      function main() {
        const solved = solveKernelFromTarget();
        solvedKernel = solved.kernel;
        targetProfile = solved.target;
        predictedProfile = solved.predicted;

        basicGrid = generateBasicGrid();
        upgradedGrid = generateUpgradedGrid(solvedKernel);
        diffGrid = subtractGrids(upgradedGrid, basicGrid);
        displayMode();
      }

      main();
    </script>
  </body>
</html>
