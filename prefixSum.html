<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>차분 배열 기반 캡슐 효과 결과</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      table {
        border-collapse: collapse;
        margin-top: 20px;
      }
      td,
      th {
        border: 1px solid #ccc;
       
        text-align: center;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .bresenham-point {
        background-color: red;
        color: white;
        font-weight: bold;
      }

      /* 원 반경 내에 있는 셀에 적용할 클래스 */
      .circle-hover {
        background-color: #ff99cc !important;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>직선 가중치 구하기 [Brute Force, O(R²N)] (가중치: easeInOutCubic)</h1>
      <div id="output"></div>
    </div>

    <script>
      const easeInOutCubic = (x) => x;
      
      function generateGradientGrid(endX, endY, radius) {
        let startX = radius;
        let startY = radius;

        if (endX <= radius || endY <= radius) {
          throw Error(
            `도착지점은 (${radius}, ${radius})보다 커야합니다. 현재: (${endX}, ${endY})`,
          );
        }

        const ceiledRadius = Math.ceil(radius);
        const width = Math.abs(endX - startX) + 2 * ceiledRadius + 1;
        const height = Math.abs(endY - startY) + 2 * ceiledRadius + 1;

        const length = Math.hypot(endX - startX, endY - startY);

        // 2D 배열 초기화
        let grid = Array.from({ length: height }, () => Array(width).fill(0));

        // 원의 이동 경로를 따라 값 추가
        // t는 나누기 오류때문에 약간 보정
        for (let t = 0; t <= 1.001; t += 1 / length) {
          const cx = startX + t * (endX - startX);
          const cy = startY + t * (endY - startY);

          //console.log(cx, cy);
          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              const d = Math.hypot(
                x + startX - ceiledRadius - cx,
                y + startY - ceiledRadius - cy,
              );
              const value = Math.max(0, 1 - d / radius);
              grid[y][x] += value; // 누적
            }
          }
        }
        //console.log(length);
        return grid;
      }

      function main() {
        const radius = 4; // 소수점 R 값 가능
     
        let grid = generateGradientGrid(10, 10, radius);
        console.table(grid.map((row) => row.map((v) => v.toFixed(2))));

        displayResultTable(grid, radius);
      }


      
      // HTML 테이블로 결과 출력
      function displayResultTable(grid, radius) {
        const outputDiv = document.getElementById("output");
        let html = `<table style="border-collapse: collapse;">`;

        html += `<tr><th style="width: 16px; height: 16px; font-size: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;"></th>`;
        for (let x = 0; x < grid[0].length; x++) {
          html += `<th style="width: 16px; height: 16px; font-size: 6px; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">${x}</th>`;
        }
        html += "</tr>";

        for (let y = 0; y < grid.length; y++) {
          html += `<tr><th style="width: 16px; height: 16px; font-size: 6px; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">${y}</th>`;
          for (let x = 0; x < grid[y].length; x++) {
            const cellValue = grid[y][x].toFixed(2);
            const alpha = (grid[y][x] / radius).toFixed(2);
            const backgroundColor = `rgba(255, 0, 0, ${alpha})`;
            html += `<td style="
              width: 16px; 
              height: 16px; 
              font-size: 6px; 
              text-align: center; 
              overflow: hidden; 
              white-space: nowrap; 
              text-overflow: ellipsis; 
              background-color: ${backgroundColor};
              padding: 0;
            ">${cellValue}</td>`;
          }
          html += "</tr>";
        }
        html += "</table>";
        outputDiv.innerHTML = html;
      }



      window.onload = main;
    </script>
  </body>
</html>
