<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>차분 배열 기반 캡슐 효과 결과</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      table {
        border-collapse: collapse;
        margin-top: 20px;
      }
      td,
      th {
        border: 1px solid #ccc;
        padding: 5px 10px;
        text-align: center;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .bresenham-point {
        background-color: red;
        color: white;
        font-weight: bold;
      }
      /* 마우스 올렸을 때 효과 */
      td:hover {
        background-color: #ff99cc !important;
        transition: background-color 0.2s ease-in-out;
      }
      /* 원 반경 내에 있는 셀에 적용할 클래스 */
      .circle-hover {
        background-color: #ff99cc !important;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>차분 배열 기반 캡슐 효과 결과</h1>
      <div id="output"></div>
    </div>

    <script>
      // 1. Bresenham 알고리즘: 두 점 (x0, y0)와 (x1, y1)를 잇는 선상의 픽셀 좌표들을 반환
      function bresenhamLine(start, end) {
        let x0 = start.x;
        let y0 = start.y;
        let x1 = end.x;
        let y1 = end.y;

        if (![x0, y0, x1, y1].every(Number.isInteger)) {
          throw new Error(
            `좌표 값은 정수여야 합니다. 받은 값: x0=${x0}, y0=${y0}, x1=${x1}, y1=${y1}`,
          );
        }

        const coordinates = [];
        let dx = Math.abs(x1 - x0);
        let dy = Math.abs(y1 - y0);
        let sx = x0 < x1 ? 1 : -1;
        let sy = y0 < y1 ? 1 : -1;
        let err = dx - dy;

        while (true) {
          coordinates.push({ x: x0, y: y0 });
          if (x0 === x1 && y0 === y1) break;
          let e2 = 2 * err;
          if (e2 > -dy) {
            err -= dy;
            x0 += sx;
          }
          if (e2 < dx) {
            err += dx;
            y0 += sy;
          }
        }
        return coordinates;
      }

      // 2. 차분 배열 업데이트 및 최종 결과 계산 함수
      function generateResultGrid(width, height, R, centers) {
        // 소수점 R인 경우도 처리하기 위해, effective_R는 그대로 R 사용
        const effective_R = R; // 여기서는 effective_R = R; (R이 소수점이면 그대로 사용)

        // 2차원 차분 배열 초기화
        const diff = [];
        for (let y = 0; y < height; y++) {
          diff[y] = new Array(width).fill(0);
        }

        // 각 원 중심(centers)에 대해 업데이트
        centers.forEach((center) => {
          const cx = center.x;
          const cy = center.y;
          // y 범위: 중심에서 effective_R만큼 확장 (정수 그리드 경계를 위해 floor/ceil 적용)
          const yStart = Math.max(0, Math.floor(cy - effective_R));
          const yEnd = Math.min(height - 1, Math.ceil(cy + effective_R));

          for (let y = yStart; y <= yEnd; y++) {
            const dy = y - cy;
            // x 영향 범위: dx = floor( sqrt( (effective_R)^2 - (y-cy)^2 ) )
            const dx = Math.floor(
              Math.sqrt(effective_R * effective_R - dy * dy),
            );
            const xLeft = Math.max(0, cx - dx);
            const xRight = Math.min(width - 1, cx + dx);
            diff[y][xLeft] += 1;
            if (xRight + 1 < width) {
              diff[y][xRight + 1] -= 1;
            }
          }
        });

        // 누적합 계산하여 최종 결과 배열 복원
        const result = [];
        for (let y = 0; y < height; y++) {
          result[y] = new Array(width).fill(0);
          let sum = 0;
          for (let x = 0; x < width; x++) {
            sum += diff[y][x];
            result[y][x] = sum;
          }
        }
        return result;
      }

      // 3. 그리드 크기를 자동으로 계산하는 함수 (R, start, end가 주어지면)
      function calculateGridSize(R, start, end) {
        const centers = bresenhamLine(start, end);

        // 경계를 정수로 만들기 위해 내림, 올림 처리 반지름이 1.1이여도 2칸 여유두기
        let minX = Math.floor(start.x - R);
        let maxX = Math.ceil(end.x + R);
        let minY = Math.floor(start.y - R);
        let maxY = Math.ceil(end.y + R);

        const gridWidth = maxX - minX + 1;
        const gridHeight = maxY - minY + 1;

        return { gridWidth, gridHeight, minX, minY, centers };
      }

      // 4. HTML 테이블로 결과 출력
      function displayResultTable(grid, centers) {
        const outputDiv = document.getElementById("output");
        let html = "<table>";

        // 브레젠험 점들을 쉽게 찾기 위해 집합 생성 (좌표 문자열)
        const centerSet = new Set(centers.map((p) => `${p.x},${p.y}`));

        // 테이블 헤더 (열 인덱스)
        html += "<tr><th></th>";
        for (let x = 0; x < grid[0].length; x++) {
          html += `<th>${x}</th>`;
        }
        html += "</tr>";

        // 각 행
        for (let y = 0; y < grid.length; y++) {
          html += `<tr><th>${y}</th>`;
          for (let x = 0; x < grid[y].length; x++) {
            const cellValue = grid[y][x];
            // 만약 이 셀이 원(브레젠험) 좌표라면, 빨간색 배경 적용
            const isBresenhamPoint = centerSet.has(`${x},${y}`);
            html += `<td class="${isBresenhamPoint ? "bresenham-point" : ""}">${cellValue}</td>`;
          }
          html += "</tr>";
        }
        html += "</table>";
        outputDiv.innerHTML = html;
      }

      // 5. 메인 함수: 결과 계산 후 HTML 테이블 출력
      function main() {
        const R = 1.5; // 소수점 R 값 가능
        const start = { x: 2, y: 2 };
        const end = { x: 20, y: 10 };

        const { gridWidth, gridHeight, minX, minY, centers } =
          calculateGridSize(R, start, end);
        const resultGrid = generateResultGrid(
          gridWidth,
          gridHeight,
          R,
          centers,
        );

        console.log(
          `Calculated Grid Size: Width = ${gridWidth}, Height = ${gridHeight}`,
        );
        console.table(resultGrid);

        displayResultTable(resultGrid, centers);
      }

      window.onload = main;
    </script>
  </body>
</html>
