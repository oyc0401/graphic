        </div>
        <div id="resize-handle-rb" class="handle resize-handle">
          <div class="handleGrab"></div>
        </div>
        <div id="selection-size"><p id="selection-text"></p></div>
        <div id="resize-size"><p id="resize-text"></p></div>
      </div>
