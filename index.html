<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>픽셀 유동화</title>
        <style>
            body{
                position: relative;
                margin: 0;;
            }
            canvas {
                cursor: crosshair;
                transition: border-color 0.3s;
                image-rendering: pixelated;
                position: absolute;
                left:0;
                top:0;
            }

            .helper-canvas{
                z-index: 1;
            }

            #canvas, #helper-canvas {
                width: 900px;  /* 9x9 크기에서 9배 확대 */
                height: 900px; /* 9x9 크기에서 9배 확대 */
                image-rendering: pixelated;  /* 확대시 픽셀화 효과를 보이게 */
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
<canvas id='helper-canvas'></canvas>
        <script src='main.js'></script>
    </body>
</html>
