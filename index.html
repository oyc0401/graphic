<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>픽셀 유동화</title>
        <style>
            body{
                position: relative;
                margin: 0;;
            }
            canvas {
                cursor: crosshair;
                transition: border-color 0.3s;
                image-rendering: pixelated;
                position: absolute;
                left:0;
                top:0;
            }

            .helper-canvas{
                z-index: 1;
            }

             #info-box {
                position: absolute;
                background: rgba(0, 0, 0, 0.7);
                color: white;
                padding: 5px;
                font-size: 12px;
                border-radius: 5px;
                pointer-events: none;
                white-space: nowrap;
              }

            
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
<canvas id='helper-canvas'></canvas>
        <div id="info-box"></div>
        <script src='main.js'></script>
    </body>
</html>
