<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>WEBGL!</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overscroll-behavior: none; /* 배경 스크롤 방지 */
        touch-action: none;
      }
      #container {
        position: relative;
        display: flex;
        flex-direction: column;
        background-color: gray;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #layer-area {
        background-color: white;
        cursor: crosshair;
        image-rendering: pixelated;
        position:absolute;
        border: none;
      }

      .layer {
        position: relative;
        height: 100%;
        width: 100%;
      }
      canvas {
        cursor: crosshair;
        image-rendering: pixelated;
        width: 100%;
        height: 100%;
         position: absolute;
      }
      #canvas {
        /* top:300px; */
         /* background-color: green;  */
        z-index: 1;
      }
      #draw-canvas {
        /* background-color: blue; */
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="layer-area">
        <div class="layer">
          <canvas id="canvas"></canvas>
          <canvas id="draw-canvas"></canvas>
        </div>
      </div>
    </div>

    <script type="module" src="main.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      eruda.init();
    </script>
