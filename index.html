      <div id="layer-area">

          <canvas id="canvas"></canvas>
        </div>
        <div id="selection-area"></div>
        <div id="handle-lt" class="handle"></div>
        <div id="handle-t" class="handle"></div>
        <div id="handle-rt" class="handle"></div>
        <div id="handle-r" class="handle"></div>
        <div id="handle-rb" class="handle"></div>
        <div id="handle-b" class="handle"></div>
        <div id="handle-lb" class="handle"></div>
        <div id="handle-l" class="handle"></div>
      </div>
    </div>

    <div id="zoom-area"></div>

    <div id="brush-cursor"></div>

    <script type="module" src="src/main.ts"></script>
