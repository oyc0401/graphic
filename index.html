<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

        <title>WEBGL!</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                 overscroll-behavior: none; /* 배경 스크롤 방지 */
            }
            #container {
                position: relative;
                display: flex;
                flex-direction: column;
                background-color: gray;
                width: 100%;
                height: 100%;
                overflow: hidden;
                
            }
            canvas {
                background-color: white;
                cursor: crosshair;
                transition: border-color 0.3s;
                image-rendering: pixelated;
                position: absolute;
                border: none;
                
            }
        </style>
    </head>
    <body>
        <div id="container">
            <canvas id="canvas"></canvas>
        </div>

        <script type="module" src="main.js"></script>


        <style>
          .log-box {
            width: 100%;
            height: 33vh;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
            font-size: 0.9rem;
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 9999;
          }

          .log-message {
            margin: 5px 0;
            line-height: 1.4;
          }

          .error-message {
            color: #ff4d4d;
          }
        </style>
        <div class="log-box" id="logBox"></div>
        <script>
          // 로그 박스에 메시지를 추가하는 함수
          function addLogMessage(message, isError = false) {
            const logBox = document.getElementById("logBox");
            const logEntry = document.createElement("div");
            logEntry.className = "log-message" + (isError ? " error-message" : "");
            logEntry.textContent = message;

            logBox.appendChild(logEntry);
            logBox.scrollTop = logBox.scrollHeight;
          }

          // console.log와 console.error 재정의
          const originalLog = console.log;
          const originalError = console.error;

          function formatLogArguments(args) {
            return Array.from(args)
              .map(arg => {
                if (typeof arg === "object") {
                  try {
                    return JSON.stringify(arg);
                  } catch (error) {
                    return "_";
                  }
                }
                return String(arg);
              })
              .join(" ");
          }

          console.log = function (...args) {
            originalLog.apply(console, args);
            addLogMessage(formatLogArguments(args));
          };

          console.error = function (...args) {
            originalError.apply(console, args);
            addLogMessage(formatLogArguments(args), true);
          };

          // 테스트 메시지
          console.log("이것은 일반 로그 메시지입니다.", { key: "value" }, 42);
          console.error("이것은 에러 메시지입니다.", ["배열", "테스트"], null);
        </script>
    </body>
</html>
